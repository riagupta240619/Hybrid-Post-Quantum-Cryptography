databases:
  - name: pqshield-db
    databaseName: pqshield_db
    user: pqshield_db_user
    plan: free
    region: singapore

services:
  - type: web
    name: pqshield-api
    runtime: docker
    repo: https://github.com/riagupta240619/Hybrid-Post-Quantum-Cryptography
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MQTT_ENABLED
        value: "false"
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: pqshield-ui
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: pqshield-db
          property: connectionString

  - type: web
    name: pqshield-ui
    runtime: static
    repo: https://github.com/riagupta240619/Hybrid-Post-Quantum-Cryptography
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pqshield-api
          property: host
